name: Deploy guide + live tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The 10-minute election-night refresh (schedule + an Oracle-server trigger) was switched off when the
  # count was closed on 2026-11-04. A manual run still refreshes the 2026 results once.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.window.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop the schedule after the count is over
        id: window
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20261231 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' && steps.window.outputs.skip != 'true'
        with:
          python-version: '3.13'
      - name: Refresh 2026 House + Senate results and rebuild the scorecards
        if: github.event_name != 'push' && steps.window.outputs.skip != 'true'
        run: |
          pip install -q -r ml/requirements.txt
          python ml/fetch_data.py --only 2026
          python ml/build.py
          python ml/build_senate.py
          if [ -n "$(git status --porcelain data/raw web/src/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw web/src/data
            git commit -m "Refresh 2026 House results ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi

      - uses: actions/setup-node@v4
        if: steps.window.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build site
        if: steps.window.outputs.skip != 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        if: steps.window.outputs.skip != 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.window.outputs.skip != 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
